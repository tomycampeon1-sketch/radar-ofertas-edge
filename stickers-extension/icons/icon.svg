<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Background tile -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1fd17a"/>
      <stop offset="1" stop-color="#047a63"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#023d31" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bg)"/>
  <!-- The sticker: a tilted white tile -->
  <g transform="rotate(-9 64 64)" filter="url(#sh)">
    <rect x="26" y="26" width="76" height="76" rx="22" fill="#ffffff"/>
  </g>
  <!-- Sound: a waveform printed on the sticker -->
  <g transform="rotate(-9 64 64)" stroke="#05987a" stroke-width="9" stroke-linecap="round">
    <path d="M44 57v14"/>
    <path d="M57 47v34"/>
    <path d="M70 53v22"/>
    <path d="M83 59v10"/>
  </g>
  <!-- Small spark: it moves -->
  <path d="M100 14l3.2 8.3 8.3 3.2-8.3 3.2-3.2 8.3-3.2-8.3-8.3-3.2 8.3-3.2z" fill="#ffffff"/>
</svg>

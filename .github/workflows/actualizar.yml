name: Actualizar ofertas

on:
  schedule:
    - cron: "17 */6 * * *" # cada 6 horas: en Argentina 3:17, 9:17, 15:17 y 21:17
  workflow_dispatch: {} # botón "Run workflow" para actualizar a mano
  push:
    branches: [main]
    paths: ["productos.json", "scraper/**", "extension/lib/core/**", "docs/data/aportes.json"]

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pruebas
        run: node --test scraper/test.mjs
      - name: Revisar tiendas y actualizar la base
        run: node scraper/run.mjs
      - name: Guardar la base nueva
        run: |
          git config user.name "radar-ofertas-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/db.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Actualizar ofertas $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin main
          git push
